<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cổng nhà cung cấp</title>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--pri:#1F4E79;--pri-soft:#E7F0F8;--ink:#1F1F1F;--ink2:#6B6B6B;--line:#E6E6E6;--bg:#F5F6F7;--ok:#1E8E5A;--warn:#B26A00;--red:#C73A1F}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,"PingFang SC","Noto Sans SC",sans-serif;font-size:14px;color:var(--ink);background:var(--bg);line-height:1.5}
button{font:inherit;border:0;cursor:pointer;border-radius:8px;padding:8px 14px;background:var(--pri);color:#fff;font-weight:600}
button.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
button.soft{background:var(--pri-soft);color:var(--pri)}
button:disabled{opacity:.45;cursor:default}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;width:100%}
a{color:var(--pri)}
.top{background:#fff;border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.top .b{font-weight:800;font-size:16px}.top .sp{flex:1}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs a{padding:7px 12px;border-radius:8px;text-decoration:none;color:var(--ink)}
.tabs a.on{background:var(--pri-soft);color:var(--pri);font-weight:700}
.lang button{background:transparent;color:var(--ink2);padding:4px 6px;font-size:12px;font-weight:500}
.lang button.on{background:var(--pri-soft);color:var(--pri);font-weight:700}
.main{max-width:1100px;margin:0 auto;padding:20px}
h1{font-size:20px;margin-bottom:12px}h2{font-size:16px;margin:16px 0 8px}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px}
.tw{overflow-x:auto;background:#fff;border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:13px}
th{background:#FAFAFA;color:var(--ink2);font-weight:600;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;background:#F0F0F0;color:var(--ink2);white-space:nowrap}
.tag.ok{background:#E6F4EC;color:var(--ok)}.tag.warn{background:#FBF1DF;color:var(--warn)}.tag.red{background:#FBEBEB;color:var(--red)}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px 14px}
.form label{display:block;font-size:12px;color:var(--ink2);margin-bottom:3px}
.form .full{grid-column:1/-1}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.muted{color:var(--ink2);font-size:12px}
.acts{display:flex;gap:6px;flex-wrap:wrap}.acts button{padding:4px 9px;font-size:12px}
.thumb{width:44px;height:44px;border-radius:6px;background:#EEE center/cover}
.login{max-width:380px;margin:10vh auto;background:#fff;border-radius:14px;padding:24px}
.login input{margin-bottom:10px}.login button{width:100%;padding:11px}
.toast{position:fixed;right:20px;top:20px;background:rgba(0,0,0,.85);color:#fff;padding:10px 16px;border-radius:10px;z-index:99;max-width:360px}
.ship{display:flex;gap:6px;flex-wrap:wrap}.ship input{width:130px}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function(){
'use strict';
var C = window.APP_CONFIG;
var sb = window.supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY, { auth: { storageKey: 'supplier-auth' } });
var T = {
  vi: { title:'Cổng nhà cung cấp', products:'Sản phẩm', shipments:'Đơn cần giao', statements:'Đối soát', profile:'Thông tin', logout:'Đăng xuất',
    login:'Đăng nhập', register:'Đăng ký', email:'Email', password:'Mật khẩu (ít nhất 6 ký tự)', toReg:'Chưa có tài khoản? Đăng ký', toLogin:'Đã có tài khoản? Đăng nhập',
    company:'Tên công ty', contact:'Người liên hệ', phone:'Điện thoại', tax:'Mã số thuế', address:'Địa chỉ', bank:'Ngân hàng', bankAcc:'Số tài khoản', bankName:'Chủ tài khoản',
    submit:'Gửi đăng ký', save:'Lưu', pending:'Hồ sơ đang chờ duyệt. Chúng tôi sẽ liên hệ sớm.', rejected:'Hồ sơ chưa được duyệt', suspended:'Tài khoản đang tạm dừng. Vui lòng liên hệ chúng tôi.',
    addProduct:'Thêm sản phẩm', editProduct:'Sửa sản phẩm', nameVi:'Tên (tiếng Việt) *', nameZh:'Tên (tiếng Trung)', nameEn:'Tên (tiếng Anh)', supply:'Giá cung cấp (chưa VAT) *', vat:'Thuế VAT',
    stock:'Tồn kho', image:'Ảnh', descVi:'Mô tả (tiếng Việt)', descZh:'Mô tả (tiếng Trung)', descEn:'Mô tả (tiếng Anh)', clear:'Làm mới',
    retail:'Giá bán lẻ (nền tảng đặt)', review:'Duyệt', on:'Đang bán', off:'Chưa bán', rv_pending:'Chờ duyệt', rv_approved:'Đã duyệt', rv_rejected:'Không duyệt',
    reviewNote:'Sản phẩm mới hoặc thay đổi giá cung cấp / VAT cần nền tảng duyệt lại. Nền tảng đặt giá bán lẻ và giá doanh nghiệp.',
    st_pending:'Chờ giao', st_shipped:'Đang giao', st_delivered:'Đã giao', all:'Tất cả', orderNo:'Mã đơn', items:'Sản phẩm', receiver:'Người nhận', created:'Ngày tạo',
    carrier:'Hãng vận chuyển', tracking:'Mã vận đơn', ship:'Giao hàng', deliver:'Đã giao xong', gift:'Quà tặng', amount:'Tiền cung cấp', exportCsv:'Xuất CSV',
    deliverConfirm:'Xác nhận khách đã nhận hàng?', period:'Kỳ', count:'Số đơn', status:'Trạng thái', paid:'Đã thanh toán', unpaid:'Chờ thanh toán', detail:'Chi tiết',
    stmtNote:'Đối soát hàng tháng: đơn đã giao và qua thời hạn đổi trả. Vui lòng xuất hóa đơn VAT cho nền tảng theo số tiền đối soát.', none:'Chưa có dữ liệu', deliveredAt:'Ngày giao' },
  zh: { title:'供应商后台', products:'商品', shipments:'发货单', statements:'对账单', profile:'资料', logout:'退出登录',
    login:'登录', register:'注册', email:'邮箱', password:'密码（至少 6 位）', toReg:'还没有账号？注册', toLogin:'已有账号？登录',
    company:'公司名称', contact:'联系人', phone:'电话', tax:'税号', address:'地址', bank:'开户银行', bankAcc:'银行账号', bankName:'账户名',
    submit:'提交申请', save:'保存', pending:'资料正在审核，我们会尽快联系您。', rejected:'申请未通过', suspended:'账号已暂停，请联系我们。',
    addProduct:'添加商品', editProduct:'修改商品', nameVi:'名称（越南语）*', nameZh:'名称（中文）', nameEn:'名称（英文）', supply:'供货价（未税）*', vat:'VAT 税率',
    stock:'库存', image:'图片', descVi:'介绍（越南语）', descZh:'介绍（中文）', descEn:'介绍（英文）', clear:'清空',
    retail:'零售价（平台定）', review:'审核', on:'在售', off:'未上架', rv_pending:'待审核', rv_approved:'已通过', rv_rejected:'未通过',
    reviewNote:'新商品、或修改供货价 / 税率后，需要平台重新审核。零售价和企业价由平台设定。',
    st_pending:'待发货', st_shipped:'配送中', st_delivered:'已签收', all:'全部', orderNo:'订单号', items:'商品', receiver:'收货人', created:'创建时间',
    carrier:'快递公司', tracking:'快递单号', ship:'发货', deliver:'已签收', gift:'礼品', amount:'供货金额', exportCsv:'导出 CSV',
    deliverConfirm:'确认客户已签收？', period:'月份', count:'单数', status:'状态', paid:'已付款', unpaid:'待付款', detail:'明细',
    stmtNote:'每月对账：已签收且过了退货期的发货单。请按对账金额给平台开具 VAT 发票。', none:'暂无数据', deliveredAt:'签收时间' }
};
var lang = (function(){ try { var l = localStorage.getItem('lang'); if (l==='zh'||l==='vi') return l; } catch(e){} return (navigator.language||'').toLowerCase().indexOf('zh')===0?'zh':'vi'; })();
var S = { sup:null };
function t(k){ return (T[lang] && T[lang][k]) || T.vi[k] || k; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function $(id){ return document.getElementById(id); }
function vnd(n){ return Math.round(Number(n)||0).toLocaleString('vi-VN'); }
function dt(d){ if(!d) return ''; var x=new Date(d); return x.toLocaleDateString(lang==='zh'?'zh-CN':'vi-VN')+' '+x.toTimeString().slice(0,5); }
function toast(m){ var d=document.createElement('div'); d.className='toast'; d.textContent=m; document.body.appendChild(d); setTimeout(function(){d.remove();},2600); }
async function rpc(fn,a){ var r=await sb.rpc(fn,a||{}); if(r.error) throw r.error; return r.data; }
function err(e){ toast((e&&e.message)||'Error'); }
function each(sel, fn){ Array.prototype.forEach.call(document.querySelectorAll(sel), fn); }
function csv(name, header, rows){
  var lines=[header].concat(rows).map(function(r){ return r.map(function(v){ v=String(v==null?'':v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }).join(','); });
  var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['﻿'+lines.join('\n')],{type:'text/csv;charset=utf-8'})); a.download=name+'.csv'; a.click();
}
function langBar(){ return '<div class="lang">'+['vi','zh'].map(function(l){ return '<button class="'+(lang===l?'on':'')+'" data-l="'+l+'">'+({vi:'VI',zh:'中'})[l]+'</button>'; }).join('')+'</div>'; }
function bindLang(cb){ each('[data-l]', function(b){ b.onclick=function(){ lang=b.getAttribute('data-l'); try{localStorage.setItem('lang',lang);}catch(e){} cb(); }; }); }
function addrText(a){ a = a || {}; return [a.name, a.phone, a.detail].filter(Boolean).join(' · '); }

// ---------- 登录 / 注册 ----------
function pLogin(mode){
  var reg = mode === 'register';
  $('root').innerHTML = '<div class="login">'+langBar()+'<h1>'+esc(C.BRAND_NAME)+' · '+t('title')+'</h1>'+
    '<input id="em" type="email" placeholder="'+t('email')+'" autocomplete="email"><input id="pw" type="password" placeholder="'+t('password')+'" autocomplete="'+(reg?'new-password':'current-password')+'">'+
    '<button id="go">'+t(reg?'register':'login')+'</button><p style="margin-top:12px;text-align:center"><a href="#" id="sw">'+t(reg?'toLogin':'toReg')+'</a></p></div>';
  bindLang(function(){ pLogin(mode); });
  $('sw').onclick = function(e){ e.preventDefault(); pLogin(reg ? 'login' : 'register'); };
  $('go').onclick = async function(){
    var em=$('em').value.trim(), pw=$('pw').value; if (!em || pw.length < 6) return toast(t('password'));
    var r = reg ? await sb.auth.signUp({ email: em, password: pw }) : await sb.auth.signInWithPassword({ email: em, password: pw });
    if (r.error) return err(r.error);
    if (reg && !r.data.session) { var l = await sb.auth.signInWithPassword({ email: em, password: pw }); if (l.error) return err(l.error); }
    boot();
  };
}

async function boot(){
  if (C.SUPABASE_URL.indexOf('YOUR-PROJECT') >= 0) { $('root').innerHTML = '<div class="login">config.js</div>'; return; }
  var s = (await sb.auth.getSession()).data.session;
  if (!s) return pLogin('login');
  S.sup = await rpc('supplier_me').catch(function(){ return null; });
  if (S.sup && !S.sup.id) S.sup = null;
  route();
}

function frame(){
  var active = S.sup && S.sup.status === 'active';
  var tabs = active ? ['products','shipments','statements','profile'] : ['profile'];
  var cur = (location.hash||'#products').slice(1);
  $('root').innerHTML = '<div class="top"><div class="b">'+esc(C.BRAND_NAME)+' · '+t('title')+(S.sup?' · '+esc(S.sup.name):'')+'</div><div class="tabs">'+
    tabs.map(function(x){ return '<a href="#'+x+'" class="'+(cur===x?'on':'')+'">'+t(x)+'</a>'; }).join('')+'</div><div class="sp"></div>'+langBar()+
    '<a href="#" id="lo">'+t('logout')+'</a></div><div class="main" id="main"></div>';
  bindLang(route);
  $('lo').onclick = async function(e){ e.preventDefault(); await sb.auth.signOut(); location.hash=''; pLogin('login'); };
}
function route(){
  frame();
  var h = (location.hash||'').slice(1);
  if (!S.sup || S.sup.status !== 'active') return pProfile();
  ({ products:pProducts, shipments:pShipments, statements:pStatements, profile:pProfile }[h] || pProducts)().catch(err);
}

// ---------- 资料 / 注册 ----------
async function pProfile(){
  var s = S.sup || {}; var b = s.bank_info || {};
  var head = !S.sup ? '' : s.status==='pending' ? '<div class="card"><span class="tag warn">'+t('pending')+'</span></div>' :
    s.status==='rejected' ? '<div class="card"><span class="tag red">'+t('rejected')+'</span> '+esc(s.note||'')+'</div>' :
    s.status==='suspended' ? '<div class="card"><span class="tag red">'+t('suspended')+'</span></div>' : '';
  var locked = s.status === 'active' || s.status === 'suspended';
  $('main').innerHTML = '<h1>'+t(S.sup?'profile':'register')+'</h1>'+head+'<div class="card"><div class="form">'+
    '<div><label for="f_n">'+t('company')+' *</label><input id="f_n" value="'+esc(s.name||'')+'"'+(locked?' disabled':'')+'></div>'+
    '<div><label for="f_t">'+t('tax')+'</label><input id="f_t" value="'+esc(s.tax_code||'')+'"'+(locked?' disabled':'')+'></div>'+
    '<div><label for="f_c">'+t('contact')+'</label><input id="f_c" value="'+esc(s.contact_name||'')+'"></div>'+
    '<div><label for="f_p">'+t('phone')+' *</label><input id="f_p" value="'+esc(s.phone||'')+'"></div>'+
    '<div><label for="f_e">'+t('email')+'</label><input id="f_e" value="'+esc(s.email||'')+'"></div>'+
    '<div class="full"><label for="f_a">'+t('address')+'</label><input id="f_a" value="'+esc(s.address||'')+'"></div>'+
    '<div><label for="f_b">'+t('bank')+'</label><input id="f_b" value="'+esc(b.bank||'')+'"></div>'+
    '<div><label for="f_ba">'+t('bankAcc')+'</label><input id="f_ba" value="'+esc(b.account||'')+'"></div>'+
    '<div><label for="f_bn">'+t('bankName')+'</label><input id="f_bn" value="'+esc(b.name||'')+'"></div></div>'+
    '<div style="margin-top:12px"><button id="sv">'+t(S.sup?'save':'submit')+'</button></div></div>';
  $('sv').onclick = async function(){
    try { S.sup = await rpc('supplier_register', { p_info: { name:$('f_n').value, tax_code:$('f_t').value, contact_name:$('f_c').value, phone:$('f_p').value,
        email:$('f_e').value, address:$('f_a').value, bank_info:{ bank:$('f_b').value, account:$('f_ba').value, name:$('f_bn').value } } });
      toast('✓'); route(); } catch(e){ err(e); }
  };
}

// ---------- 商品 ----------
async function pProducts(){
  var list = (await sb.from('products').select('*').eq('supplier_id', S.sup.id).order('id', { ascending: false })).data || [];
  var editId = null;
  $('main').innerHTML = '<h1>'+t('products')+'</h1><p class="muted" style="margin-bottom:10px">'+t('reviewNote')+'</p>'+
    '<div class="card"><h2 style="margin-top:0" id="ft">'+t('addProduct')+'</h2><div class="form">'+
    '<div><label for="p_vi">'+t('nameVi')+'</label><input id="p_vi"></div><div><label for="p_zh">'+t('nameZh')+'</label><input id="p_zh"></div><div><label for="p_en">'+t('nameEn')+'</label><input id="p_en"></div>'+
    '<div><label for="p_sp">'+t('supply')+'</label><input id="p_sp" type="number" min="0"></div>'+
    '<div><label for="p_vat">'+t('vat')+'</label><select id="p_vat"><option value="0.1">10%</option><option value="0.08">8%</option><option value="0.05">5%</option><option value="0">0%</option></select></div>'+
    '<div><label for="p_st">'+t('stock')+'</label><input id="p_st" type="number" min="0"></div>'+
    '<div class="full"><label for="p_file">'+t('image')+'</label><input id="p_file" type="file" accept="image/*"></div>'+
    '<div class="full"><label for="p_dvi">'+t('descVi')+'</label><textarea id="p_dvi" rows="2"></textarea></div>'+
    '<div class="full"><label for="p_dzh">'+t('descZh')+'</label><textarea id="p_dzh" rows="2"></textarea></div>'+
    '<div class="full"><label for="p_den">'+t('descEn')+'</label><textarea id="p_den" rows="2"></textarea></div></div>'+
    '<div style="margin-top:12px" class="acts"><button id="sv">'+t('save')+'</button><button class="sec" id="nw">'+t('clear')+'</button></div></div>'+
    (list.length ? '<div class="tw"><table><tr><th></th><th>'+t('nameVi')+'</th><th class="n">'+t('supply')+'</th><th class="n">VAT</th><th class="n">'+t('retail')+'</th><th class="n">'+t('stock')+'</th><th>'+t('review')+'</th><th></th></tr>'+
      list.map(function(p){ return '<tr><td><div class="thumb" style="background-image:url(\''+esc(p.image_url||'')+'\')"></div></td><td>'+esc(p.name_vi)+'<div class="muted">'+esc(p.name_zh)+'</div></td>'+
        '<td class="n">'+vnd(p.supply_price)+'</td><td class="n">'+Math.round(p.vat_rate*100)+'%</td><td class="n">'+(p.price_net>0?vnd(p.price_net):'—')+'</td><td class="n">'+p.stock+'</td>'+
        '<td><span class="tag '+({pending:'warn',approved:'ok',rejected:'red'})[p.review_status]+'">'+t('rv_'+p.review_status)+'</span> <span class="tag">'+(p.active?t('on'):t('off'))+'</span>'+
        (p.review_note?'<div class="muted">'+esc(p.review_note)+'</div>':'')+'</td><td><button class="sec" data-e="'+p.id+'">'+t('editProduct')+'</button></td></tr>'; }).join('')+'</table></div>' : '');
  function fill(p){ editId = p ? p.id : null; $('ft').textContent = t(p?'editProduct':'addProduct');
    $('p_vi').value=p?p.name_vi:''; $('p_zh').value=p?p.name_zh:''; $('p_en').value=p?p.name_en:''; $('p_sp').value=p?p.supply_price:'';
    $('p_vat').value=p?String(Number(p.vat_rate)):'0.1'; $('p_st').value=p?p.stock:''; $('p_dvi').value=p?p.desc_vi:''; $('p_dzh').value=p?p.desc_zh:''; $('p_den').value=p?p.desc_en:''; $('p_file').value=''; }
  each('[data-e]', function(b){ b.onclick=function(){ fill(list.filter(function(p){ return p.id===+b.getAttribute('data-e'); })[0]); window.scrollTo(0,0); }; });
  $('nw').onclick = function(){ fill(null); };
  $('sv').onclick = async function(){
    var btn=this; btn.disabled=true;
    try {
      var img = null; var f = $('p_file').files[0];
      if (f) { var path = 'sup' + S.sup.id + '/' + Date.now() + '-' + f.name.replace(/[^a-zA-Z0-9.]/g,''); var up = await sb.storage.from('products').upload(path, f); if (up.error) throw up.error;
        img = sb.storage.from('products').getPublicUrl(path).data.publicUrl; }
      await rpc('supplier_save_product', { p_id: editId, p: { name_vi:$('p_vi').value, name_zh:$('p_zh').value, name_en:$('p_en').value, supply_price:+$('p_sp').value,
        vat_rate:+$('p_vat').value, stock:+$('p_st').value, image_url:img||'', desc_vi:$('p_dvi').value, desc_zh:$('p_dzh').value, desc_en:$('p_den').value } });
      toast('✓'); pProducts();
    } catch(e){ err(e); } btn.disabled=false;
  };
}

// ---------- 发货单 ----------
async function pShipments(){
  var st = (window._shipTab || 'pending');
  var list = await rpc('supplier_shipments', { p_status: st === 'all' ? null : st });
  var cls = { pending:'warn', shipped:'', delivered:'ok', cancelled:'' };
  $('main').innerHTML = '<h1>'+t('shipments')+'</h1><div class="bar">'+['pending','shipped','delivered','all'].map(function(x){ return '<button class="'+(x===st?'':'sec')+'" data-t="'+x+'">'+t(x==='all'?'all':'st_'+x)+'</button>'; }).join('')+
    '<button class="sec" id="ex">'+t('exportCsv')+'</button></div>'+
    (list.length ? '<div class="tw"><table><tr><th>'+t('orderNo')+'</th><th>'+t('items')+'</th><th>'+t('receiver')+'</th><th class="n">'+t('amount')+'</th><th>'+t('status')+'</th><th></th></tr>'+
      list.map(function(s){ return '<tr><td><b>'+esc(s.order_no)+'</b>'+(s.is_gift?' <span class="tag">'+t('gift')+'</span>':'')+'<div class="muted">'+dt(s.created_at)+'</div></td>'+
        '<td>'+(s.items||[]).map(function(i){ return esc(i.name)+' ×'+i.qty; }).join('<br>')+'</td><td>'+esc(addrText(s.address))+'</td><td class="n">'+vnd(s.supply_amount)+'</td>'+
        '<td><span class="tag '+cls[s.status]+'">'+t('st_'+s.status)+'</span>'+(s.tracking_no?'<div class="muted">'+esc(s.carrier||'')+' '+esc(s.tracking_no)+'</div>':'')+(s.period?'<div class="muted">'+t('period')+' '+esc(s.period)+'</div>':'')+'</td>'+
        '<td>'+(s.status==='pending' ? '<div class="ship"><input placeholder="'+t('carrier')+'" id="c'+s.id+'" value="GHN"><input placeholder="'+t('tracking')+'" id="k'+s.id+'"><button data-s="'+s.id+'">'+t('ship')+'</button></div>'
          : s.status==='shipped' ? '<button class="soft" data-d="'+s.id+'">'+t('deliver')+'</button>' : '')+'</td></tr>'; }).join('')+'</table></div>' : '<div class="card muted">'+t('none')+'</div>');
  each('[data-t]', function(b){ b.onclick=function(){ window._shipTab=b.getAttribute('data-t'); pShipments().catch(err); }; });
  each('[data-s]', function(b){ b.onclick=async function(){ var id=b.getAttribute('data-s'); try { await rpc('ship_shipment', { p_shipment:+id, p_carrier:$('c'+id).value, p_tracking:$('k'+id).value }); toast('✓'); pShipments(); } catch(e){ err(e); } }; });
  each('[data-d]', function(b){ b.onclick=async function(){ if(!confirm(t('deliverConfirm'))) return; try { await rpc('deliver_shipment', { p_shipment:+b.getAttribute('data-d') }); pShipments(); } catch(e){ err(e); } }; });
  $('ex').onclick = function(){ csv('shipments-'+st, [t('orderNo'), t('items'), t('receiver'), t('phone'), t('address'), t('amount'), t('status'), t('carrier'), t('tracking')],
    list.map(function(s){ var a=s.address||{}; return [s.order_no, (s.items||[]).map(function(i){ return i.name+' x'+i.qty; }).join('; '), a.name, a.phone, a.detail, s.supply_amount, t('st_'+s.status), s.carrier, s.tracking_no]; })); };
}

// ---------- 对账单 ----------
async function pStatements(){
  var list = (await sb.from('settlements').select('*').eq('supplier_id', S.sup.id).order('period', { ascending: false })).data || [];
  $('main').innerHTML = '<h1>'+t('statements')+'</h1><p class="muted" style="margin-bottom:10px">'+t('stmtNote')+'</p>'+
    (list.length ? '<div class="tw"><table><tr><th>'+t('period')+'</th><th class="n">'+t('count')+'</th><th class="n">'+t('amount')+'</th><th>'+t('status')+'</th><th></th></tr>'+
      list.map(function(s){ return '<tr><td><b>'+esc(s.period)+'</b></td><td class="n">'+s.shipment_count+'</td><td class="n"><b>'+vnd(s.amount)+'</b></td>'+
        '<td>'+(s.status==='paid'?'<span class="tag ok">'+t('paid')+'</span><div class="muted">'+dt(s.paid_at)+' '+esc(s.note||'')+'</div>':'<span class="tag warn">'+t('unpaid')+'</span>')+'</td>'+
        '<td><button class="sec" data-x="'+s.id+'" data-p="'+esc(s.period)+'">'+t('exportCsv')+'</button></td></tr>'; }).join('')+'</table></div>' : '<div class="card muted">'+t('none')+'</div>');
  each('[data-x]', function(b){ b.onclick=async function(){ try { var d = await rpc('supplier_settlement_detail', { p_settlement:+b.getAttribute('data-x') });
    csv('statement-'+b.getAttribute('data-p'), [t('orderNo'), t('items'), t('amount'), t('deliveredAt')], d.map(function(r){ return [r.order_no, (r.items||[]).map(function(i){ return i.name+' x'+i.qty; }).join('; '), r.supply_amount, dt(r.delivered_at)]; }));
  } catch(e){ err(e); } }; });
}

window.addEventListener('hashchange', function(){ if (S.sup) route(); });
document.documentElement.lang = lang;
boot();
})();
</script>
