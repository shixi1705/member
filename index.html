<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mời bạn · Nhận quà miễn phí</title>

<style>
:root{--pri:#E0452B;--pri-soft:#FDEDEA;--ink:#1F1F1F;--ink2:#6B6B6B;--line:#ECECEC;--bg:#F6F5F3;--card:#fff;--ok:#1E8E5A;--warn:#C27C0E}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Noto Sans SC",sans-serif;font-size:15px;line-height:1.5}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
a{color:inherit;text-decoration:none}
button{font:inherit;border:0;cursor:pointer}
input,select,textarea{font:inherit;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);border-color:transparent}
.wrap{max-width:560px;margin:0 auto}
.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 16px}
.top .logo{height:30px}
.top .brand{font-weight:700;font-size:16px}
.top .sub{font-size:11px;color:var(--ink2)}
.top .sp{flex:1}
.lang{display:flex;gap:4px}
.lang button{background:transparent;color:var(--ink2);padding:4px 6px;border-radius:6px;font-size:12px}
.lang button.on{background:var(--pri-soft);color:var(--pri);font-weight:700}
.back{background:transparent;font-size:22px;padding:0 6px 0 0;color:var(--ink)}
.page{padding:16px}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px}
.h1{font-size:20px;font-weight:700;margin-bottom:6px}
.h2{font-size:16px;font-weight:700;margin-bottom:10px}
.muted{color:var(--ink2);font-size:13px}
.small{font-size:12px}
.btn{display:block;width:100%;background:var(--pri);color:#fff;font-weight:700;padding:13px;border-radius:12px;text-align:center;font-size:16px}
.btn.ghost{background:var(--pri-soft);color:var(--pri)}
.btn.line{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--ink2);margin-bottom:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prod{background:var(--card);border-radius:14px;overflow:hidden;display:block}
.prod .img{aspect-ratio:1/1;background:#EEE center/cover no-repeat}
.prod .b{padding:10px}
.prod .n{font-size:14px;line-height:1.35;height:38px;overflow:hidden}
.price{color:var(--pri);font-weight:700}
.hero{background:linear-gradient(135deg,var(--pri),#F08A4B);color:#fff;border-radius:16px;padding:18px;margin-bottom:12px;display:flex;gap:14px;align-items:center}
.hero .img{width:92px;height:92px;border-radius:12px;background:#fff center/cover no-repeat;flex:none}
.hero .t{font-size:13px;opacity:.9}
.hero .big{font-size:20px;font-weight:800;line-height:1.25;margin:2px 0 8px}
.hero .btn{background:#fff;color:var(--pri);padding:9px 14px;width:auto;display:inline-block;font-size:14px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--pri-soft);color:var(--pri);font-weight:600}
.tag.ok{background:#E6F4EC;color:var(--ok)}
.tag.warn{background:#FBF1DF;color:var(--warn)}
.tag.gray{background:#F0F0F0;color:var(--ink2)}
.bar{height:10px;background:#F0E5E2;border-radius:99px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--pri);border-radius:99px;transition:width .4s}
.steps{display:flex;gap:6px;margin:12px 0}
.steps div{flex:1;text-align:center;font-size:12px;padding:8px 2px;border-radius:10px;background:#F6F5F3;color:var(--ink2)}
.steps div.on{background:var(--pri);color:#fff;font-weight:700}
.count{font-size:24px;font-weight:800;color:var(--pri);font-variant-numeric:tabular-nums}
.list .it{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.list .it .m{flex:1;min-width:0}
.list .it .r{text-align:right}
.kv{display:flex;justify-content:space-between;padding:4px 0}
.kv.total{font-weight:700;font-size:17px;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:30px;height:30px;border-radius:8px;background:#F0F0F0;font-size:18px}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}
.nav .wrap{display:flex}
.nav a{flex:1;text-align:center;padding:8px 0 6px;font-size:11px;color:var(--ink2);position:relative}
.nav a .ic{display:block;font-size:20px;line-height:1.2}
.nav a.on{color:var(--pri);font-weight:700}
.nav a .dot{position:absolute;top:4px;left:58%;background:var(--pri);color:#fff;font-size:10px;border-radius:99px;padding:0 5px;line-height:16px}
.stat{text-align:center}
.stat .v{font-size:22px;font-weight:800}
.stat .l{font-size:12px;color:var(--ink2)}
.toast{position:fixed;left:50%;top:40%;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;padding:10px 16px;border-radius:10px;z-index:99;max-width:80%;text-align:center;font-size:14px}
.qrbox{display:flex;justify-content:center;padding:8px}
.qrbox img,.qrbox canvas{max-width:100%}
.poster{width:100%;border-radius:12px;display:block}
.empty{text-align:center;color:var(--ink2);padding:30px 0}
.badge{display:inline-block;background:linear-gradient(135deg,#F5B700,#F08A4B);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;margin-left:6px}
.rules{white-space:pre-line;font-size:13px;color:var(--ink2)}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.tabs button{background:#fff;color:var(--ink2);padding:7px 12px;border-radius:99px;font-size:13px;white-space:nowrap}
.tabs button.on{background:var(--pri);color:#fff}
.spin{text-align:center;padding:40px;color:var(--ink2)}
</style>
</head>

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

function pts(vndAmt){ var p=(Number(vndAmt)||0)/pv(); var r=Math.round(p*10)/10; return (r%1===0? r.toFixed(0): r.toFixed(1)); }
function gross(p){ return Math.round(Number(p.price_net)*(1+Number(p.vat_rate))); }
function pname(p){ return (S.lang==='zh'&&p.name_zh)||(S.lang==='en'&&p.name_en)||p.name_vi; }
function pdesc(p){ return (S.lang==='zh'&&p.desc_zh)||(S.lang==='en'&&p.desc_en)||p.desc_vi||''; }
function cname(c){ return (S.lang==='zh'&&c.name_zh)||(S.lang==='en'&&c.name_en)||c.name_vi; }
function fmtDate(d){ if(!d) return ''; var x=new Date(d); return x.toLocaleDateString(S.lang==='zh'?'zh-CN':(S.lang==='en'?'en-GB':'vi-VN'))+' '+x.toTimeString().slice(0,5); }

(function captureRef(){
  var m = location.search.match(/[?&]r=([A-Za-z0-9]{4,16})/);

    lsSet('ref', JSON.stringify({ code: m[1].toUpperCase(), at: Date.now() }));

  }
})();

function cart(){ try { return JSON.parse(lsGet('cart')||'[]'); } catch(e){ return []; } }

function addCart(id, q){ var c=cart(); var f=c.filter(function(x){return x.product_id===id;})[0]; if(f) f.qty+=q; else c.push({product_id:id, qty:q}); setCart(c); }

async function loadSession(){
  var r = await sb.auth.getSession(); S.session = r.data.session;
  if (S.session) {
    var m = await sb.from('members').select('*').eq('id', S.session.user.id).maybeSingle();
    S.me = m.data || null;
    if (S.me) { try { S.home = await rpc('my_home'); } catch(e){ S.home = null; } }
  } else { S.me = null; S.home = null; }
}
async function loadProducts(){
  var r = await sb.from('products').select('*').eq('active', true).order('sort').order('id');
  S.products = r.data || [];
  var now = new Date().toISOString();
  var c = await sb.from('campaigns').select('*').lte('starts_at', now).gt('ends_at', now).order('starts_at',{ascending:false}).limit(1);
  S.campaign = (c.data && c.data[0]) || null;
}
function productById(id){ return S.products.filter(function(p){ return p.id===id; })[0]; }
function settingsFallback(){ return (S.home && S.home.settings) || { point_value:1000, task_days:7, task_target:3, ladder_points:50, compensate_points:30, bonus5_points:30, bonus10_points:100, rebate_rate:0.05, newcomer_discount:20000, first_order_min:100000, points_valid_months:12 }; }

function drawTop(title, backTo){
  var logo = C.LOGO_URL ? '<img class="logo" src="'+esc(C.LOGO_URL)+'" alt="">' : '';
  var left = backTo ? '<button class="back" onclick="history.length>1?history.back():location.hash=\''+backTo+'\'">‹</button><div class="brand">'+esc(title)+'</div>'
    : logo + '<div><div class="brand">'+esc(C.BRAND_NAME)+'</div><div class="sub">'+esc(C.BRAND_SUB)+'</div></div>';
  var langs = ['vi','zh','en'].map(function(l){ return '<button class="'+(S.lang===l?'on':'')+'" data-lang="'+l+'">'+({vi:'VI',zh:'中',en:'EN'})[l]+'</button>'; }).join('');
  $('top').innerHTML = '<div class="top">'+left+'<div class="sp"></div><div class="lang">'+langs+'</div></div>';
  Array.prototype.forEach.call(document.querySelectorAll('[data-lang]'), function(b){
    b.onclick = function(){ S.lang=b.getAttribute('data-lang'); lsSet('lang',S.lang); document.documentElement.lang=S.lang;
      if (S.me) sb.rpc('update_profile',{p_name:null,p_lang:S.lang,p_address:null,p_invoice:null}); render(); };
  });
}
function drawNav(){
  var h = location.hash || '#/';
  var n = cart().reduce(function(a,x){return a+x.qty;},0);

    var on = (i[0]==='#/' ? (h==='#/'||h==='#'||h==='') : h.indexOf(i[0])===0);

  }).join('') + '</div>';
}

        await rpc('register_member', { p_phone: phone, p_name: name, p_ref_code: code, p_lang: S.lang, p_source: channel(), p_fp: deviceId() });
      } else {

  };

function countdown(deadline){
  var ms = new Date(deadline) - Date.now(); if (ms < 0) ms = 0;
  var d = Math.floor(ms/864e5), h = Math.floor(ms%864e5/36e5), m = Math.floor(ms%36e5/6e4);
  return d+' '+t('days')+' '+h+' '+t('hours')+' '+m+' '+t('mins');
}

function loadImg(src){ return new Promise(function(res){ if(!src) return res(null); var i=new Image(); i.crossOrigin='anonymous'; i.onload=function(){res(i);}; i.onerror=function(){res(null);}; i.src=src; }); }
function wrapText(ctx, text, x, y, maxW, lh){ var chars=String(text).split(''); var line=''; for (var i=0;i<chars.length;i++){ var test=line+chars[i]; if (ctx.measureText(test).width>maxW && line){ ctx.fillText(line,x,y); line=chars[i]; y+=lh; } else line=test; } ctx.fillText(line,x,y); return y; }

async function makePoster(link){
  var c = (S.home && S.home.campaign) || S.campaign; var p = c ? (c.product || productById(c.free_product_id)) : null;
  var W=750, H=1200, cv=document.createElement('canvas'); cv.width=W; cv.height=H; var x=cv.getContext('2d');
  var pri = getComputedStyle(document.documentElement).getPropertyValue('--pri').trim() || '#E0452B';
  var g = x.createLinearGradient(0,0,W,H); g.addColorStop(0, pri); g.addColorStop(1, '#F08A4B'); x.fillStyle=g; x.fillRect(0,0,W,H);
  x.fillStyle='#fff'; x.font='bold 40px sans-serif'; x.textAlign='center'; x.fillText(C.BRAND_NAME, W/2, 90);
  x.font='28px sans-serif'; x.globalAlpha=.9; x.fillText(C.BRAND_SUB, W/2, 135); x.globalAlpha=1;
  x.fillStyle='#fff'; roundRect(x, 50, 170, W-100, 720, 28); x.fill();
  var img = await loadImg(imgUrl(p));
  if (img) { x.save(); roundRect(x, 90, 210, W-180, 420, 20); x.clip(); var s=Math.max((W-180)/img.width, 420/img.height); x.drawImage(img, 90+((W-180)-img.width*s)/2, 210+(420-img.height*s)/2, img.width*s, img.height*s); x.restore(); }
  else { x.fillStyle='#F6F5F3'; roundRect(x, 90, 210, W-180, 420, 20); x.fill(); x.font='120px sans-serif'; x.fillStyle=pri; x.fillText('🎁', W/2, 470); }
  x.fillStyle=pri; x.font='bold 52px sans-serif'; x.fillText(t('freeTitle'), W/2, 710);
  x.fillStyle='#1F1F1F'; x.font='34px sans-serif'; wrapText(x, p ? pname(p) : t('landingTitle'), W/2, 770, W-180, 44);
  x.fillStyle='#6B6B6B'; x.font='28px sans-serif'; x.fillText(S.me.name + ' ' + t('invitedBy'), W/2, 850);
  var qrDiv=document.createElement('div'); new QRCode(qrDiv, { text: link, width: 240, height: 240, correctLevel: QRCode.CorrectLevel.M });
  await new Promise(function(r){ setTimeout(r, 120); });
  var qc = qrDiv.querySelector('canvas') || qrDiv.querySelector('img');
  x.fillStyle='#fff'; roundRect(x, W/2-150, 910, 300, 260, 20); x.fill();
  if (qc) x.drawImage(qc, W/2-120, 920, 240, 240);
  return cv.toDataURL('image/png');
}
function roundRect(x, a, b, w, h, r){ x.beginPath(); x.moveTo(a+r,b); x.arcTo(a+w,b,a+w,b+h,r); x.arcTo(a+w,b+h,a,b+h,r); x.arcTo(a,b+h,a,b,r); x.arcTo(a,b,a+w,b,r); x.closePath(); }

      '<div class="kv total"><span>'+t('total')+'</span><span class="price">'+vnd(o.total_paid)+'</span></div></div>':'')+
    '<div class="card"><div class="muted small">'+t('address')+'</div><div>'+esc(a.name||'')+' · '+esc(a.phone||'')+'</div><div>'+esc(a.detail||'')+'</div>'+
    (o.tracking_no?'<div style="margin-top:8px"><span class="muted small">'+t('tracking')+'</span> <b>'+esc(o.carrier||'')+' '+esc(o.tracking_no)+'</b></div>':'')+'</div>'+
    (o.status==='pending_payment'?'<a class="btn" href="#/pay/'+o.id+'">'+t('payTitle')+'</a>':'')+
    (o.status==='shipped'?'<button class="btn" id="rc">'+t('confirmReceipt')+'</button>':'');
  if ($('rc')) $('rc').onclick = async function(){ try { await rpc('confirm_receipt',{p_order:o.id}); pageOrder(id); } catch(e){ toast(errMsg(e)); } };
}

function pageMe(){
  drawTop(t('me'));
  if (!S.me) { app().innerHTML = '<div class="card" style="text-align:center"><div class="h1">'+t('guest')+'</div><div style="height:10px"></div><a class="btn" href="#/login">'+t('login')+'</a><div style="height:8px"></div><a class="btn line" href="#/register">'+t('register')+'</a></div>'+
    '<div class="card"><div class="h2">'+t('rules')+'</div><div class="rules">'+esc(rulesText())+'</div></div>'; return; }
  var H = S.home || {};
  app().innerHTML = '<div class="card"><div class="h1">'+esc(S.me.name)+(S.me.badge?'<span class="badge">⭐ '+t('star')+'</span>':'')+'</div><div class="muted">'+esc(S.me.phone)+' · '+t('myCode')+' <b>'+esc(S.me.ref_code)+'</b></div></div>'+
    '<a class="card row" href="#/points" style="display:flex"><div class="stat"><div class="v price">'+pts((Number(H.invite_vnd)||0)+(Number(H.rebate_vnd)||0))+'</div><div class="l">'+t('points')+'</div></div><div class="stat"><div class="v">'+pts(H.earned_vnd)+'</div><div class="l">'+t('earned')+'</div></div></a>'+
    '<div class="card list">'+
      [['#/orders','myOrders','📦'],['#/friends','friends','👥'],['#/points','points','💎'],['#/redeem','redeemZone','🎁'],['#/profile','profile','✏️'],['#/rules','rules','📜']].map(function(i){
        return '<a class="it" href="'+i[0]+'"><span>'+i[2]+'</span><div class="m">'+t(i[1])+'</div><span class="muted">›</span></a>'; }).join('')+'</div>'+
    '<button class="btn line" id="lo">'+t('logout')+'</button>';
  $('lo').onclick = async function(){ await sb.auth.signOut(); S.me=null; S.home=null; go('#/'); };
}

function pageProfile(){
  if (!S.me) return needLogin();
  drawTop(t('profile'), '#/me');
  var a = S.me.address || {}; var inv = S.me.invoice_info || {};
  app().innerHTML = '<div class="card"><div class="field"><label>'+t('name')+'</label><input id="p_name" value="'+esc(S.me.name)+'"></div>'+
    '<div class="field"><label>'+t('language')+'</label><select id="p_lang"><option value="vi">Tiếng Việt</option><option value="zh">中文</option><option value="en">English</option></select></div></div>'+
    '<div class="card"><div class="h2">'+t('address')+'</div><div class="field"><label>'+t('receiver')+'</label><input id="a_name" value="'+esc(a.name||S.me.name)+'"></div>'+
    '<div class="field"><label>'+t('phone')+'</label><input id="a_phone" value="'+esc(a.phone||S.me.phone)+'"></div><div class="field"><label>'+t('detail')+'</label><textarea id="a_detail" rows="2">'+esc(a.detail||'')+'</textarea></div></div>'+
    '<div class="card"><div class="h2">'+t('invoiceOpt')+'</div><div class="field"><label>'+t('company')+'</label><input id="i_co" value="'+esc(inv.company||'')+'"></div>'+
    '<div class="field"><label>'+t('taxCode')+'</label><input id="i_tax" value="'+esc(inv.tax_code||'')+'"></div><div class="field"><label>'+t('email')+'</label><input id="i_mail" value="'+esc(inv.email||'')+'"></div></div>'+
    '<button class="btn" id="sv">'+t('save')+'</button>';
  $('p_lang').value = S.lang;
  $('sv').onclick = async function(){
    try { var m = await rpc('update_profile', { p_name: $('p_name').value, p_lang: $('p_lang').value,
        p_address: { name: $('a_name').value.trim(), phone: $('a_phone').value.trim(), detail: $('a_detail').value.trim() },
        p_invoice: { company: $('i_co').value.trim(), tax_code: $('i_tax').value.trim(), email: $('i_mail').value.trim() } });
      S.me = m; S.lang = m.lang; lsSet('lang', S.lang); toast(t('saved')); go('#/me'); } catch(e){ toast(errMsg(e)); }
  };
}

function pageRules(){ drawTop(t('rules'), '#/me'); app().innerHTML = '<div class="card"><div class="rules">'+esc(rulesText())+'</div></div>'; }

// ---------------- 路由 ----------------
var busy = false;
async function render(){
  if (busy) return; busy = true;
  try {
    var h = (location.hash || '#/').replace(/\?.*$/, ''); var parts = h.replace(/^#\/?/, '').split('/');
    drawNav(); window.scrollTo(0,0);
    switch (parts[0]) {
      case '': pageHome(); break;
      case 'landing': await pageLanding(); break;
      case 'login': pageAuth('login'); break;
      case 'register': pageAuth('register'); break;
      case 'p': pageProduct(+parts[1]); break;
      case 'cart': pageCart(); break;
      case 'checkout': await pageCheckout(); break;
      case 'pay': await pagePay(+parts[1]); break;
      case 'free': await pageFree(); break;
      case 'invite': await pageInvite(); break;
      case 'friends': await pageFriends(); break;
      case 'points': await pagePoints(); break;
      case 'redeem': pageRedeem(); break;
      case 'orders': await pageOrders(); break;
      case 'order': await pageOrder(+parts[1]); break;
      case 'me': pageMe(); break;
      case 'profile': pageProfile(); break;
      case 'rules': pageRules(); break;
      default: pageHome();
    }
  } catch(e) { console.error(e); app().innerHTML = '<div class="empty">'+esc(errMsg(e))+'</div>'; }
  busy = false;
}
window.addEventListener('hashchange', render);
sb.auth.onAuthStateChange(function(ev){ if (ev === 'SIGNED_OUT') { S.me=null; S.home=null; } });

(async function init(){
  document.documentElement.lang = S.lang;
  if (C.SUPABASE_URL.indexOf('YOUR-PROJECT') >= 0) { app().innerHTML = '<div class="empty">config.js: SUPABASE_URL / SUPABASE_ANON_KEY</div>'; return; }
  await Promise.all([loadSession(), loadProducts()]);
  if (S.me && S.me.lang && !lsGet('lang')) S.lang = S.me.lang;
  if (!location.hash && refCode() && !S.me) location.hash = '#/landing';
  render();
})();
})();
</script>
</body>
</html>
