<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理后台</title>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--pri:#E0452B;--pri-soft:#FDEDEA;--ink:#1F1F1F;--ink2:#6B6B6B;--line:#E6E6E6;--bg:#F6F5F3;--ok:#1E8E5A;--warn:#C27C0E}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,"PingFang SC","Noto Sans SC",sans-serif;font-size:14px;color:var(--ink);background:var(--bg);line-height:1.5}
button{font:inherit;border:0;cursor:pointer;border-radius:8px;padding:7px 12px;background:var(--pri);color:#fff;font-weight:600}
button.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
button.soft{background:var(--pri-soft);color:var(--pri)}
button:disabled{opacity:.45;cursor:default}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;width:100%}
.layout{display:flex;min-height:100vh}
.side{width:200px;background:#fff;border-right:1px solid var(--line);padding:16px 10px;flex:none}
.side .b{font-weight:700;font-size:16px;padding:0 8px 4px}
.side .u{font-size:12px;color:var(--ink2);padding:0 8px 14px}
.side a{display:block;padding:9px 10px;border-radius:8px;color:var(--ink);text-decoration:none;margin-bottom:2px}
.side a.on{background:var(--pri-soft);color:var(--pri);font-weight:700}
.main{flex:1;padding:20px;min-width:0}
h1{font-size:20px;margin-bottom:14px}
h2{font-size:15px;margin:16px 0 8px}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.stat .v{font-size:22px;font-weight:800}
.stat .l{font-size:12px;color:var(--ink2)}
.tw{overflow-x:auto;background:#fff;border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:13px}
th{background:#FAFAF9;font-weight:600;color:var(--ink2);white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:#F0F0F0;color:var(--ink2);white-space:nowrap}
.tag.ok{background:#E6F4EC;color:var(--ok)}.tag.warn{background:#FBF1DF;color:var(--warn)}.tag.red{background:var(--pri-soft);color:var(--pri)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar input,.bar select{width:auto;min-width:160px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{background:#fff;color:var(--ink2);border:1px solid var(--line);font-weight:500}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px 14px}
.form label{display:block;font-size:12px;color:var(--ink2);margin-bottom:3px}
.form .full{grid-column:1/-1}
.muted{color:var(--ink2);font-size:12px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.acts button{padding:4px 9px;font-size:12px}
.toast{position:fixed;right:20px;top:20px;background:rgba(0,0,0,.85);color:#fff;padding:10px 16px;border-radius:10px;z-index:99;max-width:360px}
.login{max-width:360px;margin:12vh auto;background:#fff;border-radius:14px;padding:24px}
.login input{margin-bottom:10px}
.login button{width:100%;padding:11px}
.thumb{width:40px;height:40px;border-radius:6px;background:#EEE center/cover}
@media (max-width:760px){.layout{display:block}.side{width:auto;display:flex;flex-wrap:wrap;gap:4px;border-right:0;border-bottom:1px solid var(--line)}.side .b,.side .u{width:100%}.main{padding:12px}}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function(){
'use strict';
var C = window.APP_CONFIG;
var sb = window.supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY);
var S = { user:null, staff:null, settings:null, products:[] };
var ROLE = { admin:'管理员', ops:'运营', finance:'财务', warehouse:'仓储' };
var MODS = [
  ['stats','关键数字',null],
  ['campaigns','免单活动',['ops']],
  ['products','商品管理',['ops']],
  ['orders','订单',['finance','warehouse']],
  ['shipments','发货单',['warehouse','ops','finance']],
  ['confirm','推荐确认',['ops']],
  ['points','积分管理',['ops','finance']],
  ['members','会员管理',['ops']],
  ['biz','企业客户',['ops']],
  ['suppliers','供应商',['ops']],
  ['settlements','供应商结算',['finance']],
  ['settings','活动设置',['admin']]
];
var ST = { pending_payment:['待付款','warn'], paid:['已付款','red'], shipped:['已发货',''], delivered:['已签收','ok'], refunded:['已退款',''], cancelled:['已取消',''] };
var TY = { normal:'购物', free:'免单', redeem:'兑换', gift:'礼品' };
var RF = { registered:'已注册', first_paid:'已首单', confirmed:'已确认', void:'作废' };
var LG = { ladder:'拉新', compensate:'任务补发', bonus:'阶梯奖', rebate:'返利', redeem:'兑换', withdraw:'兑现', expire:'过期', adjust:'人工调整' };

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function vnd(n){ return Math.round(Number(n)||0).toLocaleString('vi-VN'); }
function pv(){ return (S.settings && S.settings.point_value) || 1000; }
function pts(v){ var r=Math.round((Number(v)||0)/pv()*10)/10; return r%1===0?r.toFixed(0):r.toFixed(1); }
function itemsTxt(items, sep, html){ var e = html ? esc : function(x){ return String(x==null?'':x); }; var m={}, out=[];
  (items||[]).forEach(function(i){ if (i.set_key) { var g=m[i.set_key]; if (!g) { g=m[i.set_key]={ pack:'', count:i.set_count, parts:[] }; out.push(g); }
      if (i.pack || i.is_pack) g.pack=i.name; else g.parts.push(e(i.name)+'×'+(i.per_set||i.qty)); } else out.push(e(i.name)+' ×'+i.qty); });
  return out.map(function(x){ return typeof x==='string' ? x : '🎁 '+e(x.pack)+' ×'+x.count+' ['+x.parts.join(', ')+']'; }).join(sep); }
function dt(d){ if(!d) return ''; var x=new Date(d); return x.toLocaleDateString('zh-CN')+' '+x.toTimeString().slice(0,5); }
function toLocalInput(d){ if(!d) return ''; var x=new Date(d); x.setMinutes(x.getMinutes()-x.getTimezoneOffset()); return x.toISOString().slice(0,16); }
function toast(m){ var d=document.createElement('div'); d.className='toast'; d.textContent=m; document.body.appendChild(d); setTimeout(function(){d.remove();},2600); }
function can(roles){ if(!S.staff) return false; if(S.staff.role==='admin') return true; return !roles || roles.indexOf(S.staff.role)>=0; }
async function rpc(fn,args){ var r=await sb.rpc(fn,args||{}); if(r.error) throw r.error; return r.data; }
function err(e){ toast((e&&e.message)||'出错了'); }
function tag(s){ var x=ST[s]||[s,'']; return '<span class="tag '+x[1]+'">'+x[0]+'</span>'; }
function csv(name, header, rows){
  var lines=[header].concat(rows).map(function(r){ return r.map(function(v){ v=String(v==null?'':v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }).join(','); });
  var blob=new Blob(['﻿'+lines.join('\n')],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name+'.csv'; a.click();
}
function pname(id){ var p=S.products.filter(function(x){return x.id===id;})[0]; return p?p.name_vi:('#'+id); }

// ---------------- 登录 ----------------
function login(){
  $('root').innerHTML='<div class="login"><h1>管理后台登录</h1><input id="em" type="email" placeholder="邮箱"><input id="pw" type="password" placeholder="密码"><button id="go">登录</button><p class="muted" style="margin-top:10px">后台账号由管理员在 Supabase 中创建。</p></div>';
  $('go').onclick=async function(){ var r=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value}); if(r.error) return toast('邮箱或密码错误'); boot(); };
}
async function boot(){
  if (C.SUPABASE_URL.indexOf('YOUR-PROJECT')>=0) { $('root').innerHTML='<div class="login">请先在 config.js 填写 SUPABASE_URL 和 SUPABASE_ANON_KEY</div>'; return; }
  var s=(await sb.auth.getSession()).data.session; if(!s) return login();
  S.user=s.user;
  var st=await sb.from('staff').select('*').eq('user_id',s.user.id).maybeSingle();
  if(!st.data||!st.data.active){ $('root').innerHTML='<div class="login"><h1>没有后台权限</h1><p class="muted">这个账号不是后台账号。</p><button id="lo" class="sec">退出</button></div>'; $('lo').onclick=async function(){await sb.auth.signOut(); login();}; return; }
  S.staff=st.data;
  S.settings=(await sb.from('settings').select('*').eq('id',1).maybeSingle()).data;
  await loadProducts();
  frame(); window.addEventListener('hashchange', route); route();
}
async function loadProducts(){ S.products=(await sb.from('products').select('*').order('sort').order('id')).data||[]; }
function frame(){
  $('root').innerHTML='<div class="layout"><div class="side"><div class="b">'+esc(C.BRAND_NAME)+'</div><div class="u">'+esc(S.staff.name)+' · '+ROLE[S.staff.role]+'</div>'+
    MODS.filter(function(m){return can(m[2]);}).map(function(m){return '<a href="#'+m[0]+'" data-m="'+m[0]+'">'+m[1]+'</a>';}).join('')+
    '<a href="#" id="lo" style="color:var(--ink2)">退出登录</a></div><div class="main" id="main"></div></div>';
  $('lo').onclick=async function(e){ e.preventDefault(); await sb.auth.signOut(); location.hash=''; login(); };
}
function route(){
  var m=(location.hash||'#stats').slice(1).split('?')[0];
  var mod=MODS.filter(function(x){return x[0]===m;})[0];
  if(!mod||!can(mod[2])) mod=MODS[0];
  Array.prototype.forEach.call(document.querySelectorAll('[data-m]'),function(a){a.className=a.getAttribute('data-m')===mod[0]?'on':'';});
  $('main').innerHTML='<p class="muted">加载中…</p>';
  ({stats:pStats,campaigns:pCampaigns,products:pProducts,orders:pOrders,confirm:pConfirm,points:pPoints,members:pMembers,settings:pSettings,shipments:pShipments,biz:pBiz,suppliers:pSuppliers,settlements:pSettlements})[mod[0]]().catch(err);
}

// ---------------- 关键数字 ----------------
async function pStats(){
  var s=await rpc('admin_stats');
  var c=[['今日新会员',s.members_today],['本月新会员',s.members_month],['会员总数',s.members_total],['本月首单',s.first_orders_month],
    ['待确认收款',s.pending_payment],['平台待发货',s.to_ship],['供应商待发货',s.supplier_to_ship],['待确认有效',s.to_confirm],['待审核供应商',s.pending_suppliers],['待审核企业',s.pending_biz],['待审核商品',s.pending_products],['未领取礼品链接',s.gift_links_open],['待付供应商货款',vnd(s.unsettled_amount)],['本月发起免单任务',s.tasks_started_month],['本月已发免单',s.tasks_rewarded_month],
    ['本月销售额（含税）',vnd(s.sales_month_total)],['本月销售额（未税）',vnd(s.sales_month_net)],['本月发放积分',pts(s.points_issued_month_vnd)],['未兑换积分余额',pts(s.points_outstanding_vnd)+'（≈ '+vnd(s.points_outstanding_vnd)+'₫）']];
  $('main').innerHTML='<h1>关键数字</h1><div class="cards">'+c.map(function(x){return '<div class="card stat"><div class="v">'+x[1]+'</div><div class="l">'+x[0]+'</div></div>';}).join('')+'</div>'+
    '<p class="muted">未兑换积分余额是平台的负债：会员最终会用它兑换商品或兑现。打开本页时，系统会自动取消超时未付款订单、处理到期的免单任务。</p>';
}

// ---------------- 免单活动 ----------------
async function pCampaigns(){
  var cs=(await sb.from('campaigns').select('*').order('starts_at',{ascending:false})).data||[];
  var now=new Date();
  var cur=cs.filter(function(c){return new Date(c.starts_at)<=now&&new Date(c.ends_at)>now;})[0];
  var tasks=[]; if(cur){ tasks=(await sb.from('free_tasks').select('*, members(name,phone)').eq('campaign_id',cur.id).order('started_at',{ascending:false})).data||[]; }
  var opts=S.products.filter(function(p){return p.type==='normal';}).map(function(p){return '<option value="'+p.id+'">'+esc(p.name_vi)+'</option>';}).join('');
  $('main').innerHTML='<h1>免单活动</h1><div class="card"><h2 style="margin-top:0" id="ft">新建一期活动</h2><div class="form">'+
    '<div><label>活动名称（越南语）</label><input id="c_vi"></div><div><label>活动名称（中文）</label><input id="c_zh"></div><div><label>活动名称（英文）</label><input id="c_en"></div>'+
    '<div><label>免单产品</label><select id="c_p">'+opts+'</select></div><div><label>开始时间</label><input id="c_s" type="datetime-local"></div><div><label>结束时间</label><input id="c_e" type="datetime-local"></div>'+
    '<div><label>免单库存（份）</label><input id="c_st" type="number" min="0" value="50"></div></div><div style="margin-top:12px" class="acts"><button id="c_save">保存</button><button class="sec" id="c_new">清空</button></div>'+
    '<p class="muted" style="margin-top:8px">同一时间只应有一期活动；结束时间到了自动下线。阶梯积分、补发积分等数值在“活动设置”里修改。</p></div>'+
    '<div class="tw"><table><tr><th>活动</th><th>免单产品</th><th>开始</th><th>结束</th><th class="n">剩余库存</th><th>状态</th><th></th></tr>'+
    cs.map(function(c){ var on=new Date(c.starts_at)<=now&&new Date(c.ends_at)>now, fut=new Date(c.starts_at)>now;
      return '<tr><td>'+esc(c.name_vi)+'<div class="muted">'+esc(c.name_zh)+'</div></td><td>'+esc(pname(c.free_product_id))+'</td><td>'+dt(c.starts_at)+'</td><td>'+dt(c.ends_at)+'</td><td class="n">'+c.stock+'</td>'+
        '<td>'+(on?'<span class="tag ok">进行中</span>':fut?'<span class="tag warn">未开始</span>':'<span class="tag">已结束</span>')+'</td><td><button class="sec" data-e="'+c.id+'">编辑</button></td></tr>'; }).join('')+'</table></div>'+
    (cur?'<h2>本期免单任务进度（'+tasks.length+' 人发起）</h2><div class="tw"><table><tr><th>会员</th><th>发起</th><th>截止</th><th class="n">已下首单</th><th>状态</th></tr>'+
      tasks.map(function(t){ var m=t.members||{}; var s={active:['进行中','warn'],completed:['已拉满，待确认','red'],expired:['未拉满','' ],rewarded:['已发免单','ok']}[t.status];
        return '<tr><td>'+esc(m.name)+' '+esc(m.phone)+'</td><td>'+dt(t.started_at)+'</td><td>'+dt(t.deadline)+'</td><td class="n">'+t.done_count+'</td><td><span class="tag '+s[1]+'">'+s[0]+'</span></td></tr>'; }).join('')+'</table></div>':'');
  var editId=null;
  function fill(c){ editId=c?c.id:null; $('ft').textContent=c?'编辑活动 #'+c.id:'新建一期活动';
    $('c_vi').value=c?c.name_vi:''; $('c_zh').value=c?c.name_zh:''; $('c_en').value=c?c.name_en:''; if(c) $('c_p').value=c.free_product_id;
    $('c_s').value=c?toLocalInput(c.starts_at):''; $('c_e').value=c?toLocalInput(c.ends_at):''; $('c_st').value=c?c.stock:50; }
  Array.prototype.forEach.call(document.querySelectorAll('[data-e]'),function(b){ b.onclick=function(){ fill(cs.filter(function(c){return c.id===+b.getAttribute('data-e');})[0]); window.scrollTo(0,0); }; });
  $('c_new').onclick=function(){ fill(null); };
  $('c_save').onclick=async function(){
    var row={ name_vi:$('c_vi').value.trim(), name_zh:$('c_zh').value.trim(), name_en:$('c_en').value.trim(), free_product_id:+$('c_p').value,
      starts_at:new Date($('c_s').value).toISOString(), ends_at:new Date($('c_e').value).toISOString(), stock:+$('c_st').value };
    if(!row.name_vi||!$('c_s').value||!$('c_e').value) return toast('请填写名称和起止时间');
    var r = editId ? await sb.from('campaigns').update(row).eq('id',editId) : await sb.from('campaigns').insert(row);
    if(r.error) return err(r.error); toast('已保存'); pCampaigns();
  };
}

// ---------------- 商品管理 ----------------
async function pProducts(){
  await loadProducts();
  var sups={}; ((await sb.from('suppliers').select('id,name')).data||[]).forEach(function(x){ sups[x.id]=x.name; });
  var tab=(location.hash.split('?')[1]||'normal');
  var list=S.products.filter(function(p){return tab==='pending'?p.review_status==='pending':p.type===tab;});
  var RV={pending:['待审核','warn'],approved:['已通过','ok'],rejected:['未通过','red']};
  $('main').innerHTML='<h1>商品管理</h1><div class="tabs"><button data-t="normal" class="'+(tab==='normal'?'on':'')+'">普通商品</button><button data-t="pack" class="'+(tab==='pack'?'on':'')+'">🎁 礼品包装</button><button data-t="redeem" class="'+(tab==='redeem'?'on':'')+'">积分兑换区</button><button data-t="pending" class="'+(tab==='pending'?'on':'')+'">待审核（供应商）</button></div>'+(tab==='pending'?'<p class="muted" style="margin-bottom:10px">供应商新上架或改了供货价的商品。先点“编辑”设置零售价（未税）、企业价和起订量并保存，再点“通过”。</p>':'')+
    '<div class="card"><h2 style="margin-top:0" id="pt">新增商品</h2><div class="form">'+
    '<div><label>类型</label><select id="p_type"><option value="normal">普通商品</option><option value="pack">礼品包装（礼盒/礼篮/礼箱/礼袋）</option><option value="redeem">积分兑换区</option></select></div>'+
    '<div><label>名称（越南语）*</label><input id="p_vi"></div><div><label>名称（中文）</label><input id="p_zh"></div><div><label>名称（英文）</label><input id="p_en"></div>'+
    '<div class="nf"><label>未税单价（VND）</label><input id="p_price" type="number" min="0"></div><div class="nf"><label>VAT 税率</label><select id="p_vat"><option value="0.10">10%</option><option value="0.08">8%</option><option value="0.05">5%</option><option value="0">0%</option></select></div>'+
    '<div class="rf"><label>所需积分</label><input id="p_pts" type="number" min="0" step="1"></div>'+
    '<div class="nf"><label>企业价（未税，空 = 无企业价）</label><input id="p_biz" type="number" min="0"></div><div class="nf"><label>企业价起订量</label><input id="p_moq" type="number" min="1" value="1"></div>'+
    '<div class="gf"><label>推荐礼包</label><select id="p_set"><option value="false">否</option><option value="true">是（主页“推荐礼包”栏展示）</option></select></div>'+
    '<div><label>库存</label><input id="p_stock" type="number" min="0"></div><div><label>排序（小的在前）</label><input id="p_sort" type="number" value="0"></div>'+
    '<div><label>状态</label><select id="p_act"><option value="true">上架</option><option value="false">下架</option></select></div>'+
    '<div class="full"><label>图片（上传或粘贴图片网址）</label><div class="acts"><input id="p_file" type="file" accept="image/*" style="max-width:260px"><input id="p_img" placeholder="https://..." style="flex:1"></div></div>'+
    '<div class="full"><label>介绍（越南语）</label><textarea id="p_dvi" rows="2"></textarea></div><div class="full"><label>介绍（中文）</label><textarea id="p_dzh" rows="2"></textarea></div><div class="full"><label>介绍（英文）</label><textarea id="p_den" rows="2"></textarea></div>'+
    '</div><div class="muted" id="p_gross" style="margin-top:6px"></div><div style="margin-top:12px" class="acts"><button id="p_save">保存</button><button class="sec" id="p_new">清空</button></div></div>'+
    '<div class="tw"><table><tr><th></th><th>名称</th><th>供应商</th>'+(tab!=='redeem'?'<th class="n">供货价</th><th class="n">零售价（未税）</th><th class="n">VAT</th><th class="n">含税价</th><th class="n">企业价 / 起订</th><th class="n">毛利率</th>':'<th class="n">所需积分</th>')+'<th class="n">库存</th><th>状态</th><th></th></tr>'+
    list.map(function(p){ var mg=p.supply_price>0&&p.price_net>0?Math.round((p.price_net-p.supply_price)/p.price_net*100)+'%':'—';

async function pConfirm(){

  var now=Date.now();
  $('main').innerHTML='<h1>推荐确认</h1><p class="muted" style="margin-bottom:10px">已签收的订单（礼品订单从付款日起算）过了 '+s.return_days+' 天退货期后，在这里点“确认有效”。系统会自动结算：首单 → 计入免单任务或发拉新积分；第二单起 → 给推荐人 '+Math.round(s.rebate_rate*1000)/10+'% 返利积分。确认后不能撤销，可疑记录请先核查。</p>'+

    '<div class="tw"><table><tr><th>订单</th><th>会员</th><th>推荐人</th><th class="n">实付</th><th>签收</th><th>退货期</th><th>提醒</th><th></th></tr>'+
    rows.map(function(o){ var m=o.members||{}, r=refs[m.referrer_id]||null; var due=new Date(o._base).getTime()+s.return_days*864e5; var ready=due<=now;
      var warn=[]; if(m.suspicious) warn.push('同设备注册'); if(r&&o.address&&r.phone&&o.address.phone===r.phone) warn.push('收货电话与推荐人相同');

        '<td>'+esc(m.name)+'<div class="muted">'+esc(m.phone)+'</div></td><td>'+(r?esc(r.name)+'<div class="muted">'+esc(r.phone)+'</div>':'<span class="muted">无</span>')+'</td>'+
        '<td class="n">'+vnd(o.total_paid)+'</td><td>'+dt(o._base)+(o.type==='gift'?'<div class="muted">付款</div>':'')+'</td><td>'+(ready?'<span class="tag ok">已过</span>':'<span class="tag warn">'+dt(due)+' 到期</span>')+'</td>'+
        '<td>'+warn.map(function(w){return '<span class="tag red">'+w+'</span>';}).join(' ')+'</td>'+
        '<td><div class="acts"><button data-c="'+o.id+'"'+(ready?'':' '+(S.staff.role==='admin'?'':'disabled'))+'>'+(ready?'确认有效':(S.staff.role==='admin'?'提前确认':'未到期'))+'</button></div></td></tr>'; }).join('')+'</table></div>'+
    (rows.length?'':'<p class="muted" style="margin-top:10px">暂无待确认订单。</p>');
  Array.prototype.forEach.call(document.querySelectorAll('[data-c]'),function(b){ b.onclick=async function(){

  };

    '<div class="tw"><table id="tb"><tr><th>会员</th><th>邀请码</th><th>推荐人</th><th>来源</th><th class="n">邀请 / 有效</th><th>注册时间</th><th>状态</th><th></th></tr>'+
    ms.map(function(m){ var r=byId['r'+m.id]; var c=cnt[m.id]||{all:0,ok:0};
      return '<tr data-s="'+esc((m.name+' '+m.phone+' '+m.ref_code).toLowerCase())+'"><td>'+esc(m.name)+(m.badge?' ⭐':'')+'<div class="muted">'+esc(m.phone)+'</div></td><td>'+esc(m.ref_code)+'</td><td>'+(r?esc(r.name)+'<div class="muted">'+esc(r.phone)+'</div>':'<span class="muted">—</span>')+'</td>'+
        '<td>'+esc(m.source||'')+'</td><td class="n">'+c.all+' / '+c.ok+'</td><td>'+dt(m.created_at)+'</td><td>'+(m.status==='active'?'<span class="tag ok">正常</span>':'<span class="tag red">冻结</span>')+(m.suspicious?' <span class="tag warn">可疑</span>':'')+'</td>'+
        '<td><button class="sec" data-f="'+m.id+'" data-st="'+(m.status==='active'?'frozen':'active')+'">'+(m.status==='active'?'冻结':'解冻')+'</button></td></tr>'; }).join('')+'</table></div>';
  $('q').oninput=function(){ var v=this.value.toLowerCase(); Array.prototype.forEach.call(document.querySelectorAll('#tb tr[data-s]'),function(r){ r.style.display=r.getAttribute('data-s').indexOf(v)>=0?'':'none'; }); };
  $('ex').onclick=function(){ csv('members',['姓名','手机','邀请码','推荐人','推荐人手机','来源','邀请人数','有效人数','注册时间','状态'],
    ms.map(function(m){ var r=byId['r'+m.id]||{}; var c=cnt[m.id]||{all:0,ok:0}; return [m.name,m.phone,m.ref_code,r.name,r.phone,m.source,c.all,c.ok,dt(m.created_at),m.status==='active'?'正常':'冻结']; })); };
  Array.prototype.forEach.call(document.querySelectorAll('[data-f]'),function(b){ b.onclick=async function(){
    if(!confirm('确定'+(b.getAttribute('data-st')==='frozen'?'冻结':'解冻')+'该会员？')) return;
    try{ await rpc('admin_set_member_status',{p_member:b.getAttribute('data-f'),p_status:b.getAttribute('data-st')}); pMembers(); }catch(e){ err(e); } }; });
}

// ---------------- 发货单 ----------------
async function pShipments(){
  var qs=(location.hash.split('?')[1]||'').split('&'); var st=qs[0]||'pending'; var sc=qs[1]||(S.staff.role==='warehouse'?'platform':'all');
  var list=await rpc('admin_shipments',{p_status:st==='all'?null:st,p_scope:sc});
  var SS={pending:['待发货','red'],shipped:['已发货',''],delivered:['已签收','ok'],cancelled:['已取消','']};
  $('main').innerHTML='<h1>发货单</h1><p class="muted" style="margin-bottom:10px">订单付款后按供应商自动拆成发货单。平台自营的由仓储发货；供应商的由供应商在自己的后台发货，这里只能查看（客户确认收到后，运营可以帮忙点“已签收”）。</p>'+
    '<div class="tabs">'+[['pending','待发货'],['shipped','已发货'],['delivered','已签收'],['all','全部']].map(function(x){ return '<button data-st="'+x[0]+'" class="'+(st===x[0]?'on':'')+'">'+x[1]+'</button>'; }).join('')+'</div>'+
    '<div class="tabs">'+[['platform','平台自营'],['supplier','供应商'],['all','全部']].map(function(x){ return '<button data-sc="'+x[0]+'" class="'+(sc===x[0]?'on':'')+'">'+x[1]+'</button>'; }).join('')+'</div>'+
    '<div class="bar"><button class="sec" id="ex">导出 Excel（打印发货）</button></div>'+
    '<div class="tw"><table><tr><th>订单号</th><th>发货方</th><th>商品</th><th>收货人</th><th>状态</th><th>操作</th></tr>'+
    list.map(function(s){ var a=s.address||{}; var acts='';
      if(s.status==='pending'&&!s.supplier_id&&can(['warehouse'])) acts=a.detail?'<button data-sh="'+s.id+'">发货</button>':'<span class="tag red">缺收货地址</span>';
      if(s.status==='pending'&&s.supplier_id&&S.staff.role==='admin') acts='<button class="sec" data-sh="'+s.id+'">代发货</button>';
      if(s.status==='shipped'&&(s.supplier_id?can(['ops']):can(['warehouse','ops']))) acts='<button class="soft" data-dl="'+s.id+'">已签收</button>';
      return '<tr><td><b>'+esc(s.order_no)+'</b> <span class="tag">'+TY[s.order_type]+'</span><div class="muted">'+dt(s.created_at)+'</div></td><td>'+(s.supplier_id?esc(s.supplier_name):'平台自营')+'</td>'+
        '<td>'+itemsTxt(s.items,'<br>',true)+'</td><td class="muted">'+esc(a.name||'')+' '+esc(a.phone||'')+'<br>'+esc(a.detail||'')+'</td>'+
        '<td><span class="tag '+SS[s.status][1]+'">'+SS[s.status][0]+'</span>'+(s.tracking_no?'<div class="muted">'+esc(s.carrier||'')+' '+esc(s.tracking_no)+'</div>':'')+'</td><td>'+acts+'</td></tr>'; }).join('')+'</table></div>'+
    (list.length?'':'<p class="muted" style="margin-top:10px">没有发货单。</p>');
  Array.prototype.forEach.call(document.querySelectorAll('[data-st]'),function(b){ b.onclick=function(){ location.hash='shipments?'+b.getAttribute('data-st')+'&'+sc; }; });
  Array.prototype.forEach.call(document.querySelectorAll('[data-sc]'),function(b){ b.onclick=function(){ location.hash='shipments?'+st+'&'+b.getAttribute('data-sc'); }; });
  Array.prototype.forEach.call(document.querySelectorAll('[data-sh]'),function(b){ b.onclick=async function(){ var c=prompt('快递公司（如 GHN、GHTK、Viettel Post）','GHN'); if(c===null) return; var tn=prompt('快递单号'); if(!tn) return;
    try{ await rpc('ship_shipment',{p_shipment:+b.getAttribute('data-sh'),p_carrier:c,p_tracking:tn}); toast('已发货'); pShipments(); }catch(e){ err(e); } }; });
  Array.prototype.forEach.call(document.querySelectorAll('[data-dl]'),function(b){ b.onclick=async function(){ if(!confirm('确认客户已签收？')) return; try{ await rpc('deliver_shipment',{p_shipment:+b.getAttribute('data-dl')}); pShipments(); }catch(e){ err(e); } }; });
  $('ex').onclick=function(){ csv('shipments-'+st+'-'+sc,['订单号','类型','发货方','商品','收货人','电话','地址','状态','快递','单号'],
    list.map(function(s){ var a=s.address||{}; return [s.order_no,TY[s.order_type],s.supplier_id?s.supplier_name:'平台自营',itemsTxt(s.items,'; '),a.name,a.phone,a.detail,SS[s.status][0],s.carrier,s.tracking_no]; })); };
}

    ms.map(function(m){ var i=m.biz_info||{}; return '<tr><td><b>'+esc(i.company||'')+'</b><div class="muted">'+esc(i.address||'')+'</div></td><td>'+esc(i.tax_code||'')+'</td><td>'+esc(i.contact||'')+'<div class="muted">'+esc(i.email||'')+'</div></td>'+

      '<td><div class="acts">'+(m.biz_status!=='approved'?'<button data-ok="'+m.id+'">通过</button>':'')+(m.biz_status!=='rejected'?'<button class="sec" data-no="'+m.id+'">'+(m.biz_status==='approved'?'取消资格':'不通过')+'</button>':'')+'</div></td></tr>'; }).join('')+'</table></div>'+
    (ms.length?'':'<p class="muted" style="margin-top:10px">还没有企业申请。</p>');

  Array.prototype.forEach.call(document.querySelectorAll('[data-no]'),function(b){ b.onclick=async function(){ var n=prompt('原因（企业可以看到）'); if(n===null) return; try{ await rpc('admin_set_biz_status',{p_member:b.getAttribute('data-no'),p_status:'rejected',p_note:n}); pBiz(); }catch(e){ err(e); } }; });
}

// ---------------- 供应商 ----------------

  var list=(await sb.from('suppliers').select('*').order('created_at',{ascending:false})).data||[];

      '<td><div class="acts">'+(s.status!=='active'?'<button data-st="active" data-id="'+s.id+'">通过 / 恢复</button>':'')+(s.status==='active'?'<button class="sec" data-st="suspended" data-id="'+s.id+'">暂停</button>':'')+(s.status==='pending'?'<button class="sec" data-st="rejected" data-id="'+s.id+'">不通过</button>':'')+'</div></td></tr>'; }).join('')+'</table></div>'+

// ---------------- 供应商结算 ----------------
async function pSettlements(){
  var list=(await sb.from('settlements').select('*, suppliers(name, bank_info)').order('period',{ascending:false}).order('id')).data||[];
  var d=new Date(); d.setMonth(d.getMonth()-1); var lastMonth=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  $('main').innerHTML='<h1>供应商结算</h1><p class="muted" style="margin-bottom:10px">每月一次：选择月份生成结算单，系统汇总该月及以前签收、已过退货期、还没结算的供应商发货单，按供货价计算。转账后点“已付款”。供应商在自己的后台能看到对账单，请他们按金额开 VAT 发票给公司。</p>'+
    '<div class="card"><div class="bar" style="margin:0"><input id="pd" value="'+lastMonth+'" style="max-width:140px"><button id="gen">生成结算单</button></div></div>'+
    '<div class="tw"><table><tr><th>月份</th><th>供应商</th><th class="n">单数</th><th class="n">金额（未税）</th><th>收款账户</th><th>状态</th><th>操作</th></tr>'+
    list.map(function(s){ var su=s.suppliers||{}, b=su.bank_info||{}; return '<tr><td><b>'+esc(s.period)+'</b></td><td>'+esc(su.name||'')+'</td><td class="n">'+s.shipment_count+'</td><td class="n"><b>'+vnd(s.amount)+'</b></td>'+
      '<td class="muted">'+esc(b.bank||'')+' '+esc(b.account||'')+'<br>'+esc(b.name||'')+'</td><td>'+(s.status==='paid'?'<span class="tag ok">已付款</span><div class="muted">'+dt(s.paid_at)+' '+esc(s.note||'')+'</div>':'<span class="tag warn">待付款</span>')+'</td>'+
      '<td><div class="acts">'+(s.status==='pending'?'<button data-pay="'+s.id+'">已付款</button>':'')+'<button class="sec" data-x="'+s.id+'" data-n="'+esc((su.name||'')+'-'+s.period)+'">明细</button></div></td></tr>'; }).join('')+'</table></div>';
  $('gen').onclick=async function(){ try{ var r=await rpc('admin_generate_settlements',{p_period:$('pd').value.trim()}); toast(r.length?'生成 '+r.length+' 张结算单':'没有需要结算的发货单'); pSettlements(); }catch(e){ err(e); } };
  Array.prototype.forEach.call(document.querySelectorAll('[data-pay]'),function(b){ b.onclick=async function(){ var n=prompt('付款备注（如转账日期、流水号）'); if(n===null) return; try{ await rpc('admin_mark_settlement_paid',{p_id:+b.getAttribute('data-pay'),p_note:n}); pSettlements(); }catch(e){ err(e); } }; });
  Array.prototype.forEach.call(document.querySelectorAll('[data-x]'),function(b){ b.onclick=async function(){ try{ var rows=await rpc('supplier_settlement_detail',{p_settlement:+b.getAttribute('data-x')});
    csv('settlement-'+b.getAttribute('data-n'),['订单号','商品','供货金额','签收时间'],rows.map(function(r){ return [r.order_no,itemsTxt(r.items,'; '),r.supply_amount,dt(r.delivered_at)]; })); }catch(e){ err(e); } }; });
}

  var staff=(await sb.from('staff').select('*')).data||[];
  var F=[['point_value','1 积分 = 多少 VND','number'],['first_order_min','首单最低实付（VND，含税）','number'],['newcomer_discount','被推荐好友首单立减（VND）','number'],

    ['rebate_rate','持续返利比例（0.05 = 5%）','number'],['points_valid_months','积分有效期（月）','number'],['shipping_fee_net','运费（未税 VND，0 = 包邮）','number'],['shipping_vat_rate','运费 VAT 税率','number'],
    ['order_expire_hours','未付款自动取消（小时）','number'],['gift_link_days','礼品链接有效期（天）','number'],['gift_zones','礼品价位分区（含税 VND，逗号分隔，如 100000,200000,500000）','text'],['bank_id','VietQR 银行代码（如 vietinbank、vcb、970415）','text'],['bank_account','收款账号','text'],['bank_account_name','收款户名（大写无声调）','text']];
  $('main').innerHTML='<h1>活动设置</h1><div class="card"><div class="form">'+F.map(function(f){ return '<div><label>'+f[1]+'</label><input id="s_'+f[0]+'" type="'+f[2]+'" step="any" value="'+esc(s[f[0]])+'"></div>'; }).join('')+
    '<div class="full"><label>活动规则（越南语，留空则自动按以上数值生成）</label><textarea id="s_rules_vi" rows="4">'+esc(s.rules_vi)+'</textarea></div>'+
    '<div class="full"><label>活动规则（中文）</label><textarea id="s_rules_zh" rows="4">'+esc(s.rules_zh)+'</textarea></div>'+
    '<div class="full"><label>活动规则（英文）</label><textarea id="s_rules_en" rows="4">'+esc(s.rules_en)+'</textarea></div></div>'+
    '<div style="margin-top:12px"><button id="sv">保存设置</button></div><p class="muted" style="margin-top:8px">调整返利比例等会员权益前，请提前 30 天在活动规则中公告；已发放的积分不受影响。</p></div>'+
    '<h2>后台账号</h2><div class="tw"><table><tr><th>姓名</th><th>角色</th><th>状态</th></tr>'+staff.map(function(x){ return '<tr><td>'+esc(x.name)+'</td><td>'+ROLE[x.role]+'</td><td>'+(x.active?'启用':'停用')+'</td></tr>'; }).join('')+'</table></div>'+
    '<p class="muted" style="margin-top:8px">新增后台账号：在 Supabase 后台 Authentication 里创建用户，然后按部署说明运行一行 SQL 指定角色。</p>';
  $('sv').onclick=async function(){
    var row={ updated_at:new Date().toISOString(), rules_vi:$('s_rules_vi').value, rules_zh:$('s_rules_zh').value, rules_en:$('s_rules_en').value };
    F.forEach(function(f){ var v=$('s_'+f[0]).value; row[f[0]]= f[2]==='number' ? Number(v) : v.trim(); });

  };
}

boot();
})();
